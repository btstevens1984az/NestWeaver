# NestWeaver runtime (sim + SDK)
services:
  nestweaver:
    build:
      context: .
      dockerfile: Dockerfile
    image: nestweaver:local
    volumes:
      - ./configs:/app/configs:ro
      - ./docs/media:/app/docs/media
    environment:
      - NESTWEAVER_OLLAMA_URL=http://ollama:11434
      - PYTHONUNBUFFERED=1
    command: ["nestweaver", "sim-demo", "--scenario", "all"]
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Optional bridge sidecar for host↔container topic bridging experiments
  bridge:
    image: nestweaver:local
    profiles: ["bridge"]
    depends_on:
      - nestweaver
      - ollama
    environment:
      - NESTWEAVER_OLLAMA_URL=http://ollama:11434
    command: ["python", "-c", "print('NestWeaver bridge placeholder — attach ROS 2 domain bridge here')"]

volumes:
  ollama_data:
